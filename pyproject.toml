[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-to-cart"
version = "0.1.0"
description = "Turn recipe URLs or pasted recipes into a Walmart cart. Never checks out."
requires-python = ">=3.10"
dependencies = [
    "recipe-scrapers>=15.0",
    "ingredient-parser-nlp>=2.0",
    "pint>=0.24",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtc = "recipe_to_cart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
